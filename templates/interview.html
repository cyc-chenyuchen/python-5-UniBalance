{% extends "base.html" %}
{% block page_class %}interview-page{% endblock %}
{% block content %}
<section class="card form-card">
  <div class="visual-heading form-visual-heading">
    <div class="visual-copy">
      <div class="interview-meta">
        <p class="step">需求訪談</p>
        <span>問題 {{ question_number }} / {{ question_count }}</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="訪談進度" aria-valuemin="1" aria-valuemax="{{ question_count }}" aria-valuenow="{{ question_number }}" style="--progress: {{ question_number * 100 / question_count }}%"><span></span></div>
      <div class="dialogue-bubble">
        <span class="dialogue-label">校園議題訪談</span>
        <h1 class="question-title">{{ question.question }}</h1>
      </div>
    </div>
    <img class="page-illustration" src="{{ url_for('static', filename='interview-illustration.svg') }}" alt="" aria-hidden="true">
  </div>
  <p class="section-hint">選擇最符合你想法的回應，繼續整理這項需求。</p>
  <form action="/interview/answer" method="post" data-game-submit data-pending-message="{% if question_number == question_count %}正在整理需求並產生方案，請稍候。{% else %}正在準備下一題，請稍候。{% endif %}">
    <div class="option-list">
    {% for option in question.options %}
      <label class="option">
        <input type="radio" name="answer" value="{{ option }}" required>
        {{ option }}
      </label>
    {% endfor %}
    </div>
    <div class="form-actions">
      <span class="selection-hint">請選擇一項回應</span>
      <button type="submit">{% if question_number == question_count %}完成訪談並查看方案{% else %}確認並繼續{% endif %} <span aria-hidden="true">→</span></button>
    </div>
    <p class="submit-status" data-submit-status role="status" hidden></p>
  </form>
</section>
{% endblock %}
